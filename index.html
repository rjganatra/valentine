<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dhyanuuu ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6ea;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            position: relative;
        }

        /* Pre-landing Styles */
        #pre-landing {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .heart-icon {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            display: block;
            margin-bottom: 20px;
        }
        .heart-icon:hover {
            transform: scale(1.2);
        }

        /* Main Content Styles */
        #main-content { display: none; }
        h1 { color: #d63384; margin-bottom: 30px; line-height: 1.4; }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { 
            background-color: #adb5bd; 
            color: white; 
            position: absolute; 
        }
        #celebration { display: none; }
        img { width: 100%; max-width: 350px; border-radius: 15px; margin-top: 20px; }
        
        .open-btn {
            background-color: #ff4d6d;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <audio id="successSound" src="https://www.myinstants.com/media/sounds/aww-meme.mp3"></audio>

    <div class="container">
        <div id="pre-landing">
            <span class="heart-icon">💌</span>
            <h1>Hii Dhyanuuu, you have one new message...</h1>
            <button class="open-btn" onclick="showQuestion()">Click to Open</button>
        </div>

        <div id="main-content">
            <div id="question-section">
                <h1 id="question-text">Hiiii Dhyanveeee 🫠, will you be my Valentine? 💖</h1>
                <div class="buttons">
                    <button id="yesBtn">Yes</button>
                    <button id="noBtn">No</button>
                </div>
            </div>

            <div id="celebration">
                <h1>I knew you couldn't resist! Now you're stuck with me. No refunds! 😉🔥</h1>
                <img src="https://media.giphy.com/media/xULW8Bx2HlkdALCRQk/giphy.gif" alt="Jim and Pam Celebration">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionSection = document.getElementById('question-section');
        const celebration = document.getElementById('celebration');
        const successSound = document.getElementById('successSound');
        const preLanding = document.getElementById('pre-landing');
        const mainContent = document.getElementById('main-content');

        // Logic to switch from Pre-landing to Question
        function showQuestion() {
            preLanding.style.display = 'none';
            mainContent.style.display = 'block';
        }

        // The "Run Away" Logic
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // The "Success" Logic
        yesBtn.addEventListener('click', () => {
            questionSection.style.display = 'none';
            celebration.style.display = 'block';
            
            // Play the Awwww sound
            successSound.play().catch(error => {
                console.log("Audio failed to play:", error);
            });
        });
    </script>
</body>
</html>
