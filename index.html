<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dhyanuuu ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6ea;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Password Screen Styles */
        #password-screen {
            position: fixed;
            inset: 0;
            background: rgba(255, 230, 234, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .pass-input {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #ff4d6d;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        /* Rest of the existing styles */
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        #pre-landing { display: none; flex-direction: column; align-items: center; }
        .heart-icon { font-size: 80px; margin-bottom: 20px; transition: transform 0.3s ease; cursor: pointer; display: inline-block; }
        .heart-icon:hover { transform: scale(1.3); }

        #main-content { display: none; }
        h1 { color: #d63384; margin-bottom: 30px; line-height: 1.4; }
        
        .buttons { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 250px; position: relative; }

        button { padding: 10px 25px; font-size: 1.2rem; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.2s; }
        #yesBtn { background-color: #ff4d6d; color: white; z-index: 100; position: relative; }
        #noBtn { background-color: #adb5bd; color: white; z-index: 50; }
        #celebration { display: none; }
        img { width: 100%; max-width: 350px; border-radius: 15px; margin-top: 20px; }
        
        .pink-btn { background-color: #ff4d6d; color: white; padding: 12px 25px; border-radius: 50px; border: none; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="password-screen">
        <h1 style="font-size: 1.5rem;">🔒 This message is Encrypted</h1>
        <p style="color: #d63384;">Enter the secret code to unlock:</p>
        <input type="password" id="passwordInput" class="pass-input" placeholder="Hint: Fresh & Juicy 🤭">
        <button class="pink-btn" onclick="checkPassword()">Unlock</button>
        <p id="error-msg" style="color: red; display: none; margin-top: 10px;">Oops! Wrong code. Try again? 🥺</p>
    </div>

    <audio id="successSound" src="cheer.mp3" preload="auto"></audio>

    <div class="container">
        <div id="pre-landing">
            <span class="heart-icon">💌</span>
            <h1>Hii Dhyanuuu, you have one new message...</h1>
            <button class="pink-btn" onclick="showQuestion()">Click to Open</button>
        </div>

        <div id="main-content">
            <div id="question-section">
                <h1 id="question-text">Hiiii Dhyanveeee 🫣, will you be my Valentine? 💖</h1>
                <div class="buttons">
                    <button id="yesBtn">Yes</button>
                    <button id="noBtn">No</button>
                </div>
            </div>

            <div id="celebration">
                <h1>I knew you couldn't resist! Now you're stuck with me. No refunds! 😉🫂</h1>
                <img src="https://media.giphy.com/media/xULW8Bx2HlkdALCRQk/giphy.gif" alt="Jim and Pam Celebration">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successSound = document.getElementById('successSound');
        let yesScale = 1;

        // Change this to whatever you want the password to be!
        const SECRET_PASSWORD = "Fruty"; 

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if(input === SECRET_PASSWORD) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('pre-landing').style.display = 'flex';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showQuestion() {
            document.getElementById('pre-landing').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            // Warm up audio
            successSound.play().then(() => { successSound.pause(); successSound.currentTime = 0; }).catch(() => {});
        }

        function moveButton() {
            yesScale += 0.2; 
            yesBtn.style.transform = `scale(${yesScale})`;
            const yesRect = yesBtn.getBoundingClientRect();
            let newX, newY;
            const padding = 60;

            do {
                newX = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding);
                newY = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding);
            } while (
                newX < yesRect.right + padding &&
                newX + noBtn.offsetWidth > yesRect.left - padding &&
                newY < yesRect.bottom + padding &&
                newY + noBtn.offsetHeight > yesRect.top - padding
            );

            noBtn.style.position = 'fixed'; 
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });

        yesBtn.addEventListener('click', () => {
            document.getElementById('question-section').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            successSound.play();
            
            // Confetti Cannon
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              confetti({ particleCount: 40, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 } });
            }, 250);
        });
    </script>
</body>
</html>
